<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- A bold A on track orange whose crossbar is a tick: the exam, aced. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7d42"/>
      <stop offset="1" stop-color="#e03c0c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="0.65" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe7dc"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#7c1f00" flood-opacity=".38"/>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
  </g>
  <rect x="103" y="103" width="818" height="818" rx="182" fill="none" stroke="url(#rim)" stroke-width="6"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g filter="url(#lift)">
      <path d="M 318 742 L 512 286 L 706 742" stroke="url(#ink)" stroke-width="124"/>
    </g>
    <!-- the tick, where the crossbar of the A would be -->
    <path d="M 404 580 L 486 662 L 668 452" stroke="#14161b" stroke-width="76"/>
  </g>
</svg>
